name: durar-push-test
on:
  workflow_dispatch: {}
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send a test reminder to everyone subscribed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          U=$(cat worker/durar-push-url.txt)
          K=$(printf %s "durar:$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-40)
          R=$(curl -fsS -X POST -H "X-Admin: $K" "$U/admin/send"); echo "$R"
          echo "$R" | python3 -c 'import sys,json;d=json.load(sys.stdin);sys.exit(0 if d.get("sent",0)>0 else 1)'

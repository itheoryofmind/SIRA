name: durar-push
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deploy the reminder before the adhan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 49598a4e9d62c68411910837b1a2f4bd
          URL_OUT: ${{ github.workspace }}/worker/durar-push-url.txt
        run: |
          git clone --depth 1 https://github.com/itheoryofmind/durar.git /tmp/durar
          bash /tmp/durar/worker/deploy.sh
      - name: Keep the address
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add worker/durar-push-url.txt
          git diff --cached --quiet || (git commit -m "durar-push address" && git push)
